<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold gradient for premium fashion branding -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- Circular solid black background for a perfect round badge -->
  <circle cx="256" cy="256" r="240" fill="#0A0A0A" />

  <!-- Thin gold circular border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Centered Elegant Serif letter T -->
  <text x="256" y="365" text-anchor="middle" font-family="'Cinzel', 'Didot', 'Playfair Display', 'Georgia', serif" font-size="340" fill="url(#goldGrad)" font-weight="300">T</text>
</svg>
